name: Deploy BinFlow to Netlify

on:
  push:
      branches: [develop]
        workflow_dispatch:

        permissions:
          contents: read

          concurrency:
            group: binflow-production
              cancel-in-progress: true

              jobs:
                deploy:
                    runs-on: ubuntu-latest
                        steps:
                              - uses: actions/checkout@v4
                                    - uses: actions/setup-node@v4
                                            with:
                                                      node-version: 20
                                                                cache: npm
                                                                      - run: npm ci
                                                                            - run: npm test
                                                                                  - run: npm run build
                                                                                          env:
                                                                                                    VITE_API_URL: https://binflow-api.onrender.com
                                                                                                          - run: npx --yes netlify-cli@latest deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --message="GitHub Actions $GITHUB_SHA"
                                                                                                                  env:
                                                                                                                            NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                                                                                                                                      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
                                                                                                                                      
